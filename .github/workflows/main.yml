
name: Build Sudoku APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify project files
        run: |
          test -f package.json || (echo "ERROR: package.json is missing from repository root" && exit 1)
          test -f index.html || (echo "ERROR: index.html is missing from repository root" && exit 1)
          test -d src || (echo "ERROR: src folder is missing from repository root" && exit 1)
          cat package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Sudoku web app
        run: npm run build

      - name: Verify Capacitor Android dependency
        run: npm ls @capacitor/core @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
